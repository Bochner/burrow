name: Repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      force_full:
        description: Execute every check uncached for a full rehearsal
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          launcher-version: "2026.33.3"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_FULL: ${{ inputs.force_full == true }}
        run: |
          options=()
          if [ "$FORCE_FULL" = true ]; then options+=(--force-full); fi
          aspect burrow-ci plan -- "${options[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.plan.outputs.mode != 'full'
        with:
          name: evidence-reused
          path: .report-input/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  checks:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    name: ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        suite: [portable, lifecycle, files, reverse, shell, chains, reports, automation, follow, runs, hovel]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0; matches Hovel
        with:
          persist-credentials: false
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9; matches Hovel
        with:
          launcher-version: "2026.33.3"
          # Docs/support and SSH populate different dependency sets; the SSH
          # partitions share their compiled application and download caches.
          disk-cache: ${{ matrix.suite == 'portable' && 'burrow-portable' || 'burrow-ssh' }}
          repository-cache: ${{ matrix.suite == 'portable' && 'burrow-portable' || 'burrow-ssh' }}
      # Each selected test runs once; coverage owns its six production targets.
      - env:
          CHECK_MODE: ${{ inputs.force_full == true && 'preflight' || 'verify' }}
          CHECK_SUITE: ${{ matrix.suite }}
        run: aspect burrow-check "$CHECK_MODE" "$CHECK_SUITE"
      - run: aspect burrow-site stage
        if: matrix.suite == 'portable'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; matches Hovel
        if: matrix.suite == 'portable'
        with:
          name: docs-base
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve structured test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.suite }}
          path: |
            .report-input/**/suite.json
            .report-input/**/evidence/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve additional failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.suite }}
          path: |
            bazel-testlogs/**/test.log
            bazel-testlogs/**/test.xml
            bazel-testlogs/**/test.outputs/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  coverage:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          launcher-version: "2026.33.3"
          disk-cache: burrow-portable
          repository-cache: burrow-portable
      - run: aspect burrow-report coverage
      - name: Preserve coverage and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-coverage
          path: |
            .report-input/**/suite.json
            .report-input/**/coverage.lcov
            .report-input/**/evidence/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  documentation:
    needs: plan
    if: needs.plan.outputs.mode == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          launcher-version: "2026.33.3"
          disk-cache: burrow-portable
          repository-cache: burrow-portable
      - run: aspect burrow-ci docs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-documentation
          path: |
            .report-input/**/suite.json
            .report-input/**/evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  report:
    needs: [plan, checks, coverage, documentation]
    if: >-
      always() && needs.plan.result == 'success' &&
      ((needs.plan.outputs.mode == 'full' && needs.checks.result == 'success' && needs.coverage.result == 'success') ||
       (needs.plan.outputs.mode == 'docs' && needs.documentation.result == 'success') ||
       needs.plan.outputs.mode == 'reuse')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          launcher-version: "2026.33.3"
          disk-cache: burrow-portable
          repository-cache: burrow-portable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.mode == 'full'
        with:
          name: docs-base
          path: _site
      - run: aspect burrow-site stage
        if: needs.plan.outputs.mode != 'full'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: evidence-*
          path: .report-input
          merge-multiple: true
      - run: aspect burrow-report release
      - run: aspect burrow-ci stamp
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  bundle:
    needs: report
    if: >-
      always() && needs.report.result == 'success' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: aspect-build/setup-aspect@2306377a61c45954ab2df7c7311698b109364352 # v2026.26.9
        with:
          launcher-version: "2026.33.3"
          disk-cache: burrow-portable
          repository-cache: burrow-portable
      - run: aspect burrow-release bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 30

  repository:
    name: repository
    if: ${{ always() }}
    needs: [plan, checks, coverage, documentation, report, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require the selected verification and packaging jobs
        env:
          VALID: >-
            ${{ needs.plan.result == 'success' && needs.report.result == 'success' &&
                ((needs.plan.outputs.mode == 'full' && needs.checks.result == 'success' && needs.coverage.result == 'success' && needs.documentation.result == 'skipped') ||
                 (needs.plan.outputs.mode == 'docs' && needs.documentation.result == 'success' && needs.checks.result == 'skipped' && needs.coverage.result == 'skipped') ||
                 (needs.plan.outputs.mode == 'reuse' && needs.checks.result == 'skipped' && needs.coverage.result == 'skipped' && needs.documentation.result == 'skipped')) &&
                ((github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.bundle.result == 'success') ||
                 ((github.ref != 'refs/heads/main' || github.event_name == 'pull_request') && needs.bundle.result == 'skipped')) }}
        run: test "$VALID" = true
