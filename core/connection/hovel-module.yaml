apiVersion: hovel.dev/v1alpha1
kind: ModulePackage
metadata:
  name: burrow
  version: 0.1.0
  moduleType: survey
  summary: Manage Burrow workspace, SSH connections, commands, reports and selected-tunnel chains.
  tags: [dangerous]
  license: Apache-2.0
runtime:
  protocol: jsonrpc-stdio
launch:
  - selector:
      os: linux
      arch: amd64
    command: ["burrow", "module"]
